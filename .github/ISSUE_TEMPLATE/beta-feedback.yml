name: Beta feedback
description: Tell us how your first runs went and what was confusing. This page is public.
title: "[Beta feedback] "
labels: ["beta", "feedback", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Local Training Studio. **This page is public.** Please do not paste
        private examples, customer data or model answers that contain them.

        Questions about value, pricing and your team are asked privately in Studio instead:
        **Help → Send Feedback**. Those answers go only to the Studio team. Times are in Help > Save diagnostics (about.json,
        "first_run_minutes") if you want to attach that file.
  - type: dropdown
    id: task
    attributes:
      label: What did you try?
      multiple: true
      options:
        - The 5-minute demo
        - An open dataset from the library
        - My own examples (CSV, Excel or pasted)
        - Write more examples
        - Check the base model first
        - Use in Ollama
    validations:
      required: true
  - type: dropdown
    id: finished
    attributes:
      label: Did you get to a trained model you would use?
      options:
        - "Yes, and I am using it"
        - "Yes, but it is not good enough yet"
        - "No, I got stuck (please say where below)"
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: Roughly how many minutes from opening Studio to your first before/after result?
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or slow?
  - type: input
    id: gpu
    attributes:
      label: GPU and Windows version
      placeholder: e.g. RTX 4070 12 GB, Windows 11 24H2
